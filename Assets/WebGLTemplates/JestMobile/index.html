<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        background: #111;
        overflow: hidden;
      }

      #unity-frame {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        background: #000;
        overflow: hidden;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #231f20;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        width: 40%;
      }

      #unity-logo {
        width: 154px;
        height: 130px;
        margin: 0 auto 20px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        background-size: contain;
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 18px;
        background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
        background-size: 100% 100%;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 18px;
        background: url('TemplateData/progress-bar-full-dark.png') no-repeat left center;
        background-size: auto 100%;
      }

      #unity-warning {
        position: absolute;
        left: 5%;
        top: 5%;
        right: 5%;
        z-index: 10;
      }

      #unity-warning div {
        padding: 10px;
        background: #fff;
      }

      #unity-warning div.error {
        background: red;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-frame">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"></div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        if (type === "error") {
          div.className = "error";
        }
        warningBanner.appendChild(div);
        if (type !== "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
